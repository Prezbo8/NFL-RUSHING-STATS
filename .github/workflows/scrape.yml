name: Scrape FTN rushing stats

on:
  schedule:
    # 22:00 UTC on Sun/Tue/Wed = 18:00 EDT, 17:00 EST.
    # GitHub cron has no DST handling; 22:00 keeps the run at or after 5pm
    # New York year-round rather than drifting an hour early each winter.
    - cron: "0 22 * * 0,2,3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and write to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FTN_SEASON: "2026"
        run: python scrape_ftn_rushing.py
