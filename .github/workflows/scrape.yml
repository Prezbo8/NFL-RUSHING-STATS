name: Scrape FTN rushing stats

on:
  schedule:
    # 15:00 UTC on Tue/Wed/Sat = 11:00 ET while daylight saving is in effect.
    # GitHub cron has no DST handling, so this becomes 10:00 ET after the
    # November change; move to 16:00 then if 11:00 matters year-round.
    - cron: "0 15 * * 2,3,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and write to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FTN_SEASON: "2026"
        run: python scrape_ftn_rushing.py
